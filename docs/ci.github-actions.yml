name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu-2204:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 python3-pil xvfb x11-utils
      - name: Unit tests and syntax
        run: |
          /usr/bin/python3 -m unittest discover -v
          /usr/bin/python3 -m compileall -q ubuntu_support
          bash -n scripts/build-deb.sh docs/maintenance/run-razer-alc298-fix
      - name: GTK smoke test
        run: |
          mkdir -p tests/screenshots
          xvfb-run -a -s '-screen 0 1440x1100x24' env GDK_SCALE=1 GDK_DPI_SCALE=1 GSK_RENDERER=cairo /usr/bin/python3 tests/smoke_ui.py
      - name: Build Debian package
        run: |
          ./scripts/build-deb.sh
          dpkg-deb --info dist/*.deb
          cd dist
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-support-deb
          path: dist/
